name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type check
        run: mypy features models serve spark
      - name: Tests
        run: pytest
      - name: UI build
        working-directory: ui
        run: |
          npm install
          npm run build
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports
