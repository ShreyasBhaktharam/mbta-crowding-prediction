version: '3.8'
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.11
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=1024M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    networks:
      - citystream

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      - KAFKA_BROKERS=redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks:
      - citystream

  spark-master:
    image: apache/spark:3.5.1
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - citystream

  spark-worker:
    image: apache/spark:3.5.1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - citystream

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    networks:
      - citystream

  api:
    build: .
    environment:
      - KAFKA_BROKER=redpanda:9092
      - REDIS_HOST=redis
      - FEATURE_STORE_BACKEND=redis
    volumes:
      - .:/app
    depends_on:
      - redis
    ports:
      - "8000:8000"
    networks:
      - citystream

  ui:
    image: node:20
    working_dir: /workspace/ui
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - citystream

networks:
  citystream:
    driver: bridge
