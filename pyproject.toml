[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501", "ANN", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["features", "spark", "serve", "models", "pollers", "tools"]
